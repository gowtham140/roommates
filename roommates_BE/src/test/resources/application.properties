spring.application.name=roommates_BE-test

jwt.secret=test-only-jwt-secret-key-for-roommates-tests-1234567890
jwt.expiration-ms=86400000

spring.datasource.url=jdbc:h2:mem:roommates;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.sql.init.mode=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

storage.s3.bucket=test-bucket
storage.s3.endpoint=https://example.invalid
storage.s3.region=auto
storage.s3.access-key=test-access-key
storage.s3.secret-key=test-secret-key
storage.s3.path-style-access=false
app.cors.allowed-origins=http://localhost:5173

brevo.api.key=
brevo.api.url=https://api.brevo.com/v3/smtp/email
resend.api.key=
resend.api.url=https://api.resend.com/emails
app.mail.from=test@example.invalid
app.frontend.url=http://localhost:5173
app.otp.expiration-ms=600000

management.endpoints.web.exposure.include=health,info

server.port=0
