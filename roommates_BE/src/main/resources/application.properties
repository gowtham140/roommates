spring.application.name=roommates_BE
#spring.profiles.default=dev
spring.profiles.default=prod
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

jwt.secret=${JWT_SECRET:local-development-only-jwt-secret-change-me-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

storage.s3.bucket=${STORAGE_BUCKET:roomates}
storage.s3.endpoint=${STORAGE_ENDPOINT:https://t3.storage.dev}
storage.s3.region=${STORAGE_REGION:auto}
storage.s3.access-key=${STORAGE_ACCESS_KEY:}
storage.s3.secret-key=${STORAGE_SECRET_KEY:}
storage.s3.path-style-access=${STORAGE_PATH_STYLE_ACCESS:false}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://roommates-kohl.vercel.app}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:${MAIL_APP_PASSWORD:}}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
app.mail.dev-console-otp=${APP_MAIL_DEV_CONSOLE_OTP:true}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.otp.expiration-ms=${OTP_EXPIRATION_MS:600000}
app.admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.health.mail.enabled=false

server.port=${SERVER_PORT:8080}
